              private String easternDate(String pattern, Locale locale) {
                  SimpleDateFormat date = new SimpleDateFormat(pattern, locale);
                  date.setTimeZone(eastDate.getTimeZone());
                  return date.format(eastDate.getTime());
              }
          
              private String localTime(String value) {
                  try {
                      SimpleDateFormat input = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm", Locale.US);
                      input.setTimeZone(TimeZone.getTimeZone("UTC"));
                      Date date = input.parse(value);
                      if (date == null) return "时间待定";
                      return new SimpleDateFormat("MM-dd HH:mm", Locale.CHINA).format(date);
                  } catch (Exception ignored) { return "时间待定"; }
              }
          
              private static String fetch(String address) throws Exception {
                  HttpURLConnection conn = (HttpURLConnection) new URL(address).openConnection();
                  conn.setConnectTimeout(10_000);
                  conn.setReadTimeout(12_000);
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Android; NBA Free Viewer)");
                  conn.setRequestProperty("Accept", "application/json, application/xml, text/xml, */*");
                  try {
                      if (conn.getResponseCode() != 200) throw new Exception("HTTP " + conn.getResponseCode());
                      try (InputStream input = new BufferedInputStream(conn.getInputStream());
                           ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                          byte[] chunk = new byte[8192];
                          int size;
                          while ((size = input.read(chunk)) != -1) {
                              if (out.size() + size > 2_000_000) throw new Exception("服务器返回内容过大");
                              out.write(chunk, 0, size);
                          }
                          return out.toString(StandardCharsets.UTF_8.name());
                      }
                  } finally { conn.disconnect(); }
              }
          
              private static class Video {
                  String title, id, published;
                  Video(String t, String i, String p) { title = t; id = i; published = p; }
              }
          
              private static ArrayList<Video> parseFeed(String xml) throws Exception {
                  ArrayList<Video> result = new ArrayList<>();
                  XmlPullParser parser = android.util.Xml.newPullParser();
                  parser.setInput(new StringReader(xml));
                  boolean inside = false;
                  String tag = "", id = "", title = "", published = "";
                  int event = parser.getEventType();
                  while (event != XmlPullParser.END_DOCUMENT && result.size() < 12) {
                      if (event == XmlPullParser.START_TAG) {
                          tag = parser.getName();
                          if ("entry".equals(tag)) {
                              inside = true;
                              id = ""; title = ""; published = "";
                          }
                      } else if (event == XmlPullParser.TEXT && inside) {
                          String value = parser.getText();
                          if ("title".equals(tag)) title += value;
                          else if (tag.endsWith("videoId")) id += value;
                          else if ("published".equals(tag)) published += value;
                      } else if (event == XmlPullParser.END_TAG) {
                          if ("entry".equals(parser.getName())) {
                              if (id.matches("[A-Za-z0-9_-]{11}")) {
                                  String day = published.length() >= 10 ? published.substring(0, 10) : "最新";
                                  result.add(new Video(title.trim(), id.trim(), day));
                              }
                              inside = false;
                          }
                          tag = "";
                      }
                      event = parser.next();
                  }
                  return result;
              }
          
